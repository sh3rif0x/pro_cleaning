<div class="contact-form">

    <div class="contact-left">

        <h1>Find us</h1>

        <div class="contact-card">
            <div class="contact-icon"> <img src="./assets/Call_icon.svg" alt=""></div>

            <div class="contact-info">
                <h3>Call Us</h3>
                <p>+(08) 255 201 888</p>
            </div>
        </div>

        <div class="contact-card">
            <div class="contact-icon"> <img src="./assets/Email icon.svg" alt=""></div>

            <div class="contact-info">
                <h3>Email Now</h3>
                <p>Hello@procleaning.com</p>
            </div>
        </div>

        <div class="contact-card">
            <div class="contact-icon"> <img src="./assets/Address_icon.svg" alt=""></div>

            <div class="contact-info">
                <h3>Address</h3>
                <p>7510, Brand Tower, New York, USA</p>
            </div>
        </div>

    </div>


    <div class="contact-right">

        <p>Contact info</p>

        <h2>Keep In Touch</h2>

        <p>
            We prioritize responding to your inquiries promptly to ensure you receive the assistance you need in a timely manner
        </p>

        <form>

            <input type="text" name="name" placeholder="Name">

            <input type="email" name="email" placeholder="Email">

            <textarea name="message" placeholder="Message"></textarea>

            <button type="submit">
                Sent Message
            </button>

        </form>

    </div>

</div>
